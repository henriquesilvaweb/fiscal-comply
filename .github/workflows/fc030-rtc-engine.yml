name: FC-030 | Motor oficial RTC em ambiente isolado
on:
  push:
    branches:
      - prototype/fc-030-rtc-laboratorio
    paths:
      - '.github/workflows/fc030-rtc-engine.yml'
      - 'experimentos/fc-030-rtc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-engine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Conferir ambiente e código do projeto
        uses: actions/checkout@v4

      - name: Baixar fonte oficial da Receita
        uses: actions/checkout@v4
        with:
          repository: ReceitaFederal/calculadora-rtc-regime-regular
          path: official
          persist-credentials: false

      - name: Preparar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: official/pom.xml

      - name: Confirmar ambiente e licença oficial
        working-directory: official
        run: |
          java -version
          grep -E 'MIT License|Copyright' LICENSE
          chmod +x ./mvnw

      - name: Preparar base oficial SQLite com Flyway
        working-directory: official
        run: |
          mkdir -p ./calculadora/db
          ./mvnw flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf --batch-mode --errors
          test -s ./calculadora/db/calculadora-pro.db

      - name: Executar testes oficiais Maven
        working-directory: official
        run: ./mvnw clean test --batch-mode --errors

      - name: Extrair operação de exemplo do repositório oficial
        working-directory: official
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          source = pathlib.Path('docs/exemplos.md').read_text(encoding='utf-8')
          match = re.search(r'\*\*Entrada\*\*.*?```json\s*(\{.*?\})\s*```', source, re.S)
          if not match: raise SystemExit('Exemplo oficial nao encontrado')
          payload = json.loads(match.group(1))
          assert len(payload['itens']) == 4
          pathlib.Path('operacao-fc030.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False))
          print('Exemplo oficial extraido com', len(payload['itens']), 'itens')
          PY

      - name: Iniciar API offline e aguardar porta
        working-directory: official
        run: |
          nohup ./mvnw spring-boot:run -Dspring-boot.run.profiles=offline --batch-mode > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 150); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/swagger-ui.html >/dev/null 2>&1; then
              echo 'Swagger disponivel'
              exit 0
            fi
            if curl -sS --max-time 2 -o /dev/null http://127.0.0.1:8080/api/calculadora/dados-abertos/ncm; then
              echo 'API respondeu'
              exit 0
            fi
            sleep 2
          done
          tail -100 api.log
          exit 1

      - name: Enviar operação de exemplo e verificar estados
        working-directory: official
        run: |
          status=$(curl -sS --max-time 60 -o resposta-fc030.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/calculadora/observabilidade/regime-geral -H 'Content-Type: application/json' --data-binary @operacao-fc030.json)
          echo "HTTP=$status"
          test "$status" = 200
          python3 - <<'PY'
          import json
          r = json.load(open('resposta-fc030.json'))
          objs = r.get('objetos')
          assert isinstance(objs, list) and len(objs)==4, 'Itens esperados nao retornaram'
          states = [x.get('estadoItem') for x in objs]
          print('Estados:', states)
          assert states[3] == 'INCONSISTENCIA_ENTRADA', 'Quarto item deveria acusar erro da amostra oficial'
          assert all(s in ('CALCULADO','CALCULO_SIMULADO','INCONSISTENCIA_ENTRADA','NAO_IMPLEMENTADO','FALHA_TECNICA') for s in states)
          assert states[:3] == ['CALCULO_SIMULADO']*3, 'Estados dos três exemplos divergiram do documento oficial'
          item3 = objs[2]['tribCalc']['IBSCBS']['gIBSCBS']
          from decimal import Decimal
          def dec(x): return Decimal(str(x))
          assert dec(item3['vIBS']) == Decimal('0.48'), item3
          assert dec(item3['gCBS']['vCBS']) == Decimal('42.24'), item3
          totals = r['total']['tribCalc']
          assert dec(totals['IBSCBSTot']['gIBS']['vIBS']) == Decimal('0.64'), totals
          assert dec(totals['IBSCBSTot']['gCBS']['vCBS']) == Decimal('56.76'), totals
          assert dec(totals['ISTot']['vIS']) == Decimal('15.00'), totals
          print('Cálculos do exemplo oficial conferidos: IBS item 3=0.48, CBS item 3=42.24')
          print('Totais: IBS=0.64, CBS=56.76, IS=15.00. Revisão contábil ainda necessária.')
          PY

      - name: Arquivar evidências e logs sem divulgar dados reais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc030-motor-oficial-evidencias
          path: |
            official/operacao-fc030.json
            official/resposta-fc030.json
            official/api.log
            official/target/surefire-reports
          if-no-files-found: warn
          retention-days: 7
